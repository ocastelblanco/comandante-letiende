name: Firebase Hosting Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Producción: despliega al canal live en cada merge a main ─────────────
  deploy_live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watch=false

      - name: Configurar JDK (emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pruebas de firestore.rules (emulador)
        run: npx firebase-tools emulators:exec --only firestore --project demo-comandante-rules-test "npm run test:rules"

      - name: Build de producción
        run: npm run build -- --configuration=production

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}
          channelId: live
          projectId: comandante-letiende

      - name: Instalar dependencias de functions
        run: npm ci --prefix functions

      - name: Build de functions
        run: npm run build --prefix functions

      - name: Deploy Firestore rules y functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}' > /tmp/sa.json
          npx firebase-tools deploy --only firestore:rules,functions --project comandante-letiende --force
          rm /tmp/sa.json

  # ── Preview: genera URL única y la comenta en la PR automáticamente ──────
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watch=false

      - name: Configurar JDK (emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pruebas de firestore.rules (emulador)
        run: npx firebase-tools emulators:exec --only firestore --project demo-comandante-rules-test "npm run test:rules"

      - name: Build de producción
        run: npm run build -- --configuration=production

      - name: Deploy al canal de preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}
          projectId: comandante-letiende
