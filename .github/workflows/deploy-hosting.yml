name: Firebase Hosting Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Además de los tipos por defecto (opened, synchronize, reopened), 'closed' dispara
    # el job cleanup_preview, que borra el canal de preview del PR.
    types: [opened, synchronize, reopened, closed]

jobs:
  # ── Producción: despliega al canal live en cada merge a main ─────────────
  deploy_live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watch=false

      - name: Configurar JDK (emulador de Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pruebas de firestore.rules (emulador)
        run: npx firebase-tools emulators:exec --only firestore --project demo-comandante-rules-test "npm run test:rules"

      - name: Build de producción
        run: npm run build -- --configuration=production

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}
          channelId: live
          projectId: comandante-letiende

      - name: Instalar dependencias de functions
        run: npm ci --prefix functions

      - name: Build de functions
        run: npm run build --prefix functions

      - name: Deploy Firestore rules y functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}' > /tmp/sa.json
          npx firebase-tools deploy --only firestore:rules,functions --project comandante-letiende --force
          rm /tmp/sa.json

  # ── Preview: genera URL única y la comenta en la PR automáticamente ──────
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test -- --watch=false

      - name: Configurar JDK (emulador de Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pruebas de firestore.rules (emulador)
        run: npx firebase-tools emulators:exec --only firestore --project demo-comandante-rules-test "npm run test:rules"

      - name: Build de producción
        run: npm run build -- --configuration=production

      - name: Deploy al canal de preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}
          projectId: comandante-letiende
          # Respaldo por si el job cleanup_preview falla: el canal expira solo (por defecto, 7 días).
          expires: 3d

  # ── Limpieza: al cerrar o fusionar un PR, borra su canal de preview ───────
  # Un canal de preview es una copia completa de la app apuntando al Firestore y Auth de
  # producción (no hay entorno de staging aislado), y cada uno queda como dominio autorizado
  # en Firebase Auth. `hosting:channel:delete` borra el canal (con sus releases y versiones,
  # en menos de 24 h) y también quita su dominio de Firebase Auth.
  cleanup_preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Que la limpieza falle no debe marcar en rojo un PR ya cerrado; el canal expira solo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Borrar el canal de preview del PR
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMANDANTE_LETIENDE }}' > /tmp/sa.json
          # El id del canal es pr<número>-<rama> (truncado); se busca por el prefijo "pr<número>-".
          channels=$(npx firebase-tools hosting:channel:list --project comandante-letiende --json \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));const p='pr'+process.env.PR_NUMBER+'-';console.log(d.result.channels.map(c=>c.name.split('/').pop()).filter(n=>n.startsWith(p)).join(' '))")
          if [ -z "$channels" ]; then
            echo "El PR #$PR_NUMBER no tiene canal de preview; nada que borrar."
          fi
          for channel in $channels; do
            npx firebase-tools hosting:channel:delete "$channel" --project comandante-letiende --force
          done
          rm /tmp/sa.json
